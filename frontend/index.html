<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Globe News – Nachrichten auf dem Globus</title>
  <meta name="description" content="Ein drehbarer Globus mit aktuellen Nachrichten, verortet dort, wo sie passieren.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="app">
    <div id="globe" role="application" aria-label="Weltkugel mit Nachrichten-Pins"></div>

    <header class="topbar">
      <div class="brand">
        <h1 class="brand__name">Globe News</h1>
        <span class="brand__claim">Nachrichten dort, wo sie passieren</span>
      </div>
      <nav id="filters" class="filters"></nav>
    </header>

    <div id="timebar" class="timebar"></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <aside id="panel" class="panel" aria-label="Meldungen an diesem Ort" inert></aside>

    <p class="credits">
      Daten: <a href="https://www.gdeltproject.org/" target="_blank" rel="noopener">The GDELT Project</a>
    </p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
