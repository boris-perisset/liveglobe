name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Typprüfung
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Rubriken-Kopie synchron?
        run: node scripts/sync-category-map.mjs --check
      - name: Edge Function prüfen
        run: deno check supabase/functions/ingest/index.ts
      - name: Tests
        run: deno test supabase/functions/ingest/

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: PHP-Syntax prüfen
        run: find hostpoint -name '*.php' -print0 | xargs -0 -n1 php -l
